version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: vh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mysql_root_2024}
      MYSQL_DATABASE: volunteer_helper
      MYSQL_USER: ${DB_USER:-vh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vh_pass_2024}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-mysql_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vh-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: vh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vh-network

  # NestJS 后端
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: vh-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-vh_user}:${DB_PASSWORD:-vh_pass_2024}@mysql:3306/volunteer_helper
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-1}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      UPLOADS_ROOT: /app/uploads
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vh-network

  # Next.js 前端
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: vh-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - vh-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: vh-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - server
    networks:
      - vh-network

volumes:
  mysql_data:
  redis_data:
  server_uploads:

networks:
  vh-network:
    driver: bridge
